# Security validation scenarios.
#
#   ciscoaudit validate                       run every scenario against the baseline and hardened configurations
#   ciscoaudit trace "PC5 -> 203.0.113.9 tcp/22" --state hardened     explain a single flow hop by hop
#
# `expect` is what the HARDENED configuration must do; `baseline` (optional) is what the unhardened configuration does.
# Both are asserted, so the before/after story is computed from the configuration files, not told.
#
# A scenario is one of three kinds:
#   flow    "<sender> -> <destination> <proto>/<port> [sport=N] [spoof=IP] [ack] [oneway]"  judged by the policy simulator
#   audit   rules of the configuration auditor that must report nothing (expect: clean) or something (expect: finding)
#   manual  needs Packet Tracer; reported as "pending" until the lab is built and tested (see docs/pt-test-plan.md)
#
# For a flow that must be blocked, `by` names what stops it (an ACL name, route, vty or no-service), `at` the device.
#
# The simulator says what the CONFIGURATION does. It is not a Packet Tracer result - see docs/validation.md.
# Threat ids (T01-T12) refer to docs/threat-model.md.

schema: 1

scenarios:

