  - {id: L-01, title: "Switch ports do not negotiate trunking (DTP) - VLAN hopping by switch spoofing", category: layer2, threats: [T08],
     kind: audit, check: {rules: [L2-001, L2-002], device: "SW-*"}, expect: clean, baseline: finding}
  - {id: L-02, title: "Trunk native VLAN is not VLAN 1 and the trunk carries only needed VLANs - double tagging", category: layer2, threats: [T08],
     kind: audit, check: {rules: [L2-003, L2-004], device: "SW-*"}, expect: clean, baseline: finding}
  - {id: L-03, title: "Edge ports limit the number of MAC addresses - MAC flooding and unknown devices", category: layer2, threats: [T08, T12],
     kind: audit, check: {rules: [L2-005], device: "SW-*"}, expect: clean, baseline: finding}
  - {id: L-04, title: "Edge ports use PortFast with BPDU Guard - rogue switch and STP manipulation", category: layer2, threats: [T08],
     kind: audit, check: {rules: [L2-006], device: "SW-*"}, expect: clean, baseline: finding}
  - {id: L-05, title: "Unused ports are shut down and parked, nothing sits in VLAN 1", category: layer2, threats: [T12],
     kind: audit, check: {rules: [L2-007, L2-008, L2-009], device: "SW-*"}, expect: clean, baseline: finding}
  - {id: L-06, title: "VTP cannot be used to rewrite the VLAN database", category: layer2, threats: [T08],
     kind: audit, check: {rules: [L2-010], device: "SW-*"}, expect: clean, baseline: finding}
  - {id: L-07, title: "DHCP snooping protects the guest VLAN against rogue DHCP servers", category: layer2, threats: [T01, T08],
     kind: audit, check: {rules: [L2-011], device: SW-ACCESS}, expect: clean, baseline: finding,
     note: "Intended configuration; Packet Tracer support for this feature is not yet verified (docs/pt-verify.md)."}
  - {id: L-08, title: "Dynamic ARP Inspection protects the guest VLAN against ARP spoofing", category: layer2, threats: [T01, T08],
     kind: audit, check: {rules: [L2-012], device: SW-ACCESS}, expect: clean, baseline: finding,
