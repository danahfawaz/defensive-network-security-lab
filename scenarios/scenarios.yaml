  # ==================================================================================================================
  # Checks only Packet Tracer can answer (pending until you run them; see docs/pt-test-plan.md)
  # ==================================================================================================================
  - id: X-01
    title: The guest PC obtains an address, gateway and DNS server by DHCP
    category: manual
    threats: [T01]
    kind: manual
    steps:
      - "On PC2 set IP Configuration to DHCP and wait for the lease."
      - "Expect 10.10.30.100/24, gateway 10.10.30.1, DNS 172.16.50.20 (the pool excludes .1-.99)."
  - id: X-02
    title: SSH login to the firewall works and Telnet is refused
    category: manual
    threats: [T03]
    kind: manual
    steps:
      - "On the firewall run 'crypto key generate rsa modulus 2048' once (the key is not part of the exported configuration)."
      - "On PC3 open Command Prompt and run 'ssh -l admin 10.10.99.1'; log in with the admin password you generated."
      - "On PC3 run 'telnet 10.10.99.1' and confirm the connection does not open."
      - "On the firewall run 'show ip ssh' and note the SSH version."
  - id: X-03
    title: Port security shuts the port when a second device appears
    category: manual
    threats: [T08, T12]
    kind: manual
    steps:
      - "Ping from PC0 so the access switch learns its MAC address on Fa0/1."
      - "Unplug PC0, connect another PC (new MAC address) to SW-ACCESS Fa0/1 and send traffic."
      - "Run 'show port-security interface fa0/1' and 'show interfaces status err-disabled' and record the result."
  - id: X-04
    title: NAT translations appear for browsing and for the published servers
    category: manual
    threats: []
    kind: manual
    steps:
      - "Open http://198.51.100.80 on PC0, then run 'show ip nat translations' on the firewall."
      - "Open http://203.0.113.9 on PC4 and run the command again; the static entries must be listed."
  - id: X-05
    title: ACL counters show the blocked attempts
    category: manual
    threats: [T04]
    kind: manual
    steps:
      - "Run the blocked scenarios B-20 to B-25 from PC5 (ping, browser, Telnet)."
      - "Run 'show access-lists IN-OUTSIDE' on the firewall and record the hit counters of the deny entries."
  - id: X-06
    title: Syslog and NTP reach the log server
    category: manual
    threats: [T10]
    kind: manual
    steps:
      - "Enable the Syslog and NTP services on SRV-LOG."
      - "Change a setting on a device (for example shut and re-enable an unused interface) and check that SRV-LOG receives the message."
      - "Run 'show ntp status' on FW-EDGE and SW-ACCESS and record whether Packet Tracer supports it."
  - id: X-07
    title: Re-audit the configurations exported from Packet Tracer
    category: manual
    threats: [T09]
    kind: manual
    steps:
      - "On each device run 'show running-config' and save the output to a text file named <hostname>.cfg."
      - "Run 'ciscoaudit audit <folder> --waivers waivers/hardened.yaml' and compare with the committed audit of the intended configurations."
      - "Every line Packet Tracer rejected while pasting (docs/pt-verify.md) will show up as a difference."
  - id: X-08
    title: Rogue DHCP server on the guest VLAN is ignored (DHCP snooping)
    category: manual
    threats: [T08]
    kind: manual
    steps:
      - "Connect a server with a DHCP service to an unused switch port in VLAN 30."
      - "Release and renew the lease on PC2 and record which server answered."
      - "Record whether Packet Tracer supports 'ip dhcp snooping' at all."
  - id: X-09
    title: ARP inspection behaviour
    category: manual
    threats: [T08]
    kind: manual
    steps:
      - "Check whether 'ip arp inspection vlan 30' is accepted by the 2960 image in Packet Tracer."
      - "If it is, record what 'show ip arp inspection' prints; if not, mark the control as not testable in Packet Tracer."
