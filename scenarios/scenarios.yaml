     flow: "PC5 -> 203.0.113.2 tcp/22 sport=80 ack", expect: blocked, by: vty, at: FW-EDGE,
     note: "IN-OUTSIDE permits 'tcp any eq 80 host 203.0.113.2 established', which an ACK-only packet satisfies. The packet reaches the firewall itself, where the VTY access-class refuses the Internet source."}

  # ==================================================================================================================
  # Known limitations (documented in docs/limitations.md; asserted so the documentation cannot drift from the facts)
  # ==================================================================================================================
  - {id: K-01, title: "A crafted ACK from the application server reaches an employee workstation (stateless ACL)", category: limitation, threats: [T11],
     flow: "SRV-APP -> PC0 tcp/3389 sport=80 ack", expect: delivered, limitation: stateless-acl,
     note: "'established' only checks the ACK/RST flag. The workstation answers with a reset, which discloses that it is alive; no connection can be opened this way."}
  - {id: K-02, title: "A crafted ACK from the DMZ web server reaches an employee workstation (stateless ACL)", category: limitation, threats: [T05, T11],
     flow: "WEB-DMZ -> PC0 tcp/445 sport=80 ack", expect: delivered, limitation: stateless-acl}
  - {id: K-03, title: "The DMZ DNS server may send UDP from port 53 to any Internet host", category: limitation, threats: [T05, T11],
     flow: "DNS-DMZ -> WEB-EXT udp/53 sport=53", expect: delivered, limitation: stateless-acl,
     note: "UDP has no flag that 'established' can check, so DNS replies are permitted by address and source port only."}
  - {id: K-04, title: "Employees cannot reach the public web server through its public address (no hairpin NAT)", category: limitation,
     flow: "PC0 -> 203.0.113.9 tcp/80", expect: blocked, by: route, at: FW-EDGE, limitation: no-hairpin-nat,
     note: "The discard route for the public block stops the packet. Internal clients must use the private address (split DNS)."}
  - {id: K-05, title: "Employee workstations can reach each other inside the Users VLAN", category: limitation, threats: [T02],
     flow: "PC0 -> PC1 tcp/445", expect: delivered, limitation: no-intra-vlan-filtering,
     note: "Traffic inside one VLAN never reaches the firewall. Isolating hosts inside a VLAN needs private VLANs or port ACLs, which this lab does not use."}
  - {id: K-06, title: "DMZ servers can reach each other inside the DMZ VLAN", category: limitation, threats: [T05],
     flow: "WEB-DMZ -> DNS-DMZ tcp/22", expect: delivered, limitation: no-intra-vlan-filtering}

