! =============================================================================
! HARDENED CONFIGURATION - SW-DMZ (Packet Tracer device "Switch1", Cisco 2960-24TT, IOS 15.0)
! Role: DMZ switch. One VLAN (50); Fa0/3 is an access link to FW-EDGE Fa0/1 (the firewall's DMZ leg, 172.16.50.0/24).
!
! Port map:  Fa0/1 WEB-DMZ   Fa0/2 DNS-DMZ   Fa0/3 uplink to FW-EDGE   Fa0/4-24, Gi0/1-2 parked
!
! Management is in-band on the DMZ segment (SVI 172.16.50.2): there is no separate management VLAN on this switch.
! Compensating controls: the VTY lines accept SSH from the administrator workstation only, and FW-EDGE lets only that
! host reach TCP/22 here. See docs/limitations.md.
!
! Secrets: the hashes below are PLACEHOLDERS ("labonly"); scripts/render_configs.py swaps in your own.
! Lines marked [PT-VERIFY] are standard IOS but have not been executed in Packet Tracer 9.0 by the author of this
! repository; see docs/pt-verify.md.
! =============================================================================
!
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
! [PT-VERIFY] 'no service pad'
no service pad
!
hostname SW-DMZ
!
logging buffered 8192 informational
!
enable secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
no ip domain-lookup
ip domain-name lab.local
!
username admin privilege 15 secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
vtp mode transparent
!
vlan 50
 name DMZ
vlan 999
 name PARKING
!
ip ssh version 2
! [PT-VERIFY] 'ip ssh time-out' / 'ip ssh authentication-retries'
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
no ip http secure-server
no cdp run
ip default-gateway 172.16.50.1
!
! [PT-VERIFY] 'logging source-interface'
logging source-interface Vlan50
logging trap informational
logging host 10.10.99.20
! [PT-VERIFY] 'ntp server'
ntp server 10.10.99.20
!
ip access-list standard VTY-ADMIN
 permit host 10.10.99.10
 deny any log
!
interface FastEthernet0/1
 description DMZ - WEB-DMZ (public 203.0.113.9)
 switchport access vlan 50
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description DMZ - DNS-DMZ (public 203.0.113.10)
 switchport access vlan 50
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description UPLINK - FW-EDGE Fa0/1 (only the firewall's MAC may appear here)
 switchport access vlan 50
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range FastEthernet0/4 - 24
 description UNUSED
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
!
interface range GigabitEthernet0/1 - 2
 description UNUSED
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan50
 description MANAGEMENT SVI (in-band, DMZ segment)
 ip address 172.16.50.2 255.255.255.0
 no shutdown
!
banner motd #
AUTHORIZED ACCESS ONLY. This system is part of a lab network. Activity is logged and monitored.
Disconnect now if you are not an authorized administrator.
#
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line vty 0 4
 access-class VTY-ADMIN in
 exec-timeout 5 0
 login local
 transport input ssh
!
line vty 5 15
 access-class VTY-ADMIN in
 exec-timeout 5 0
 login local
 transport input ssh
!
end
