! =============================================================================
! HARDENED CONFIGURATION - SW-ACCESS (Packet Tracer device "Switch0", Cisco 2960-24TT, IOS 15.0)
! Role: access switch for the Users (10), Servers (20), Guest (30) and Management (99) VLANs.
!       Fa0/3 is the 802.1Q trunk to FW-EDGE Fa0/0, which routes between the VLANs.
!
! Port map:  Fa0/1 PC0 (Users)   Fa0/2 PC1 (Users)   Fa0/3 trunk to FW-EDGE   Fa0/4 PC2 (Guest, DHCP)
!            Fa0/5 PC3 (admin, Mgmt)   Fa0/6 SRV-APP (Servers)   Fa0/7 SRV-LOG (Mgmt)   Fa0/8-24, Gi0/1-2 parked
!
! Secrets: the hashes below are PLACEHOLDERS ("labonly"); scripts/render_configs.py swaps in your own.
! Lines marked [PT-VERIFY] are standard IOS but have not been executed in Packet Tracer 9.0 by the author of this
! repository; see docs/generated/pt-verify.md.
! =============================================================================
!
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
! [PT-VERIFY] 'no service pad'
no service pad
!
hostname SW-ACCESS
!
logging buffered 8192 informational
!
enable secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
no ip domain-lookup
ip domain-name lab.local
!
username admin privilege 15 secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
! --- Layer 2 control plane ------------------------------------------------------------------------------------------
spanning-tree mode rapid-pvst
spanning-tree extend system-id
vtp mode transparent
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 30
 name GUEST
vlan 99
 name MGMT
vlan 999
 name PARKING
!
! --- DHCP snooping and ARP inspection on the DHCP-addressed Guest VLAN only ----------------------------------------
! (Users, Servers and Mgmt use static addresses: they have no snooping bindings, so ARP inspection there would drop
!  their ARP traffic. Their protection is port security, BPDU Guard and the anti-spoofing ACLs on FW-EDGE.)
! [PT-VERIFY] DHCP snooping and Dynamic ARP Inspection on the 2960 model in Packet Tracer 9.0
ip dhcp snooping
ip dhcp snooping vlan 30
no ip dhcp snooping information option
ip arp inspection vlan 30
!
! --- Management ---------------------------------------------------------------------------------------------------------
ip ssh version 2
! [PT-VERIFY] 'ip ssh time-out' / 'ip ssh authentication-retries'
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
no ip http secure-server
no cdp run
ip default-gateway 10.10.99.1
!
! [PT-VERIFY] 'logging source-interface'
logging source-interface Vlan99
logging trap informational
logging host 10.10.99.20
! [PT-VERIFY] 'ntp server'
ntp server 10.10.99.20
!
ip access-list standard VTY-ADMIN
 permit host 10.10.99.10
 deny any log
!
! --- Edge ports -----------------------------------------------------------------------------------------------------------
interface FastEthernet0/1
 description USERS - PC0
 switchport access vlan 10
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description USERS - PC1
 switchport access vlan 10
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description TRUNK - FW-EDGE Fa0/0 (VLANs 10,20,30,99)
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport mode trunk
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
!
interface FastEthernet0/4
 description GUEST - PC2 (DHCP)
 switchport access vlan 30
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
!
interface FastEthernet0/5
 description MGMT - PC3 (administrator workstation)
 switchport access vlan 99
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/6
 description SERVERS - SRV-APP
 switchport access vlan 20
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/7
 description MGMT - SRV-LOG (syslog + NTP)
 switchport access vlan 99
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Unused ports: shut down and parked in a VLAN that nothing uses ------------------------------------------------
interface range FastEthernet0/8 - 24
 description UNUSED
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
!
interface range GigabitEthernet0/1 - 2
 description UNUSED
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 description MANAGEMENT SVI
 ip address 10.10.99.2 255.255.255.0
 no shutdown
!
banner motd #
AUTHORIZED ACCESS ONLY. This system is part of a lab network. Activity is logged and monitored.
Disconnect now if you are not an authorized administrator.
#
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line vty 0 4
 access-class VTY-ADMIN in
 exec-timeout 5 0
 login local
 transport input ssh
!
line vty 5 15
 access-class VTY-ADMIN in
 exec-timeout 5 0
 login local
 transport input ssh
!
end
