! =============================================================================
! HARDENED CONFIGURATION - FW-EDGE (Packet Tracer device "Router1", Cisco 1841, IOS 12.4)
! Role: perimeter router-firewall with three legs
!         inside  : Fa0/0 802.1Q trunk -> SW-ACCESS (Users 10 / Servers 20 / Guest 30 / Mgmt 99)
!         DMZ     : Fa0/1              -> SW-DMZ    (172.16.50.0/24)
!         outside : Eth0/1/0           -> ISP-R     (203.0.113.0/30, simulated Internet)
! Enforcement: default-deny extended ACL inbound on every interface (stateless: see docs/limitations.md),
!              NAT (PAT for Users/Guest, static NAT for the two DMZ servers), anti-spoofing, SSH-only management.
!
! Secrets: the hashes below are PLACEHOLDERS ("labonly"). scripts/render_configs.py swaps in secrets you
! choose, writing paste-ready files to build/ (git-ignored).
! Lines marked [PT-VERIFY] are standard IOS but have not been executed in Packet Tracer 9.0 by the author of this
! repository; see docs/pt-verify.md. A line that Packet Tracer rejects can be skipped: re-audit the exported config.
! =============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
! [PT-VERIFY] 'no service pad'
no service pad
!
hostname FW-EDGE
!
logging buffered 16384 informational
!
enable secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
! [PT-VERIFY] 'login block-for' (brute-force throttling)
login block-for 120 attempts 3 within 60
!
no ip source-route
no ip domain-lookup
ip domain-name lab.local
!
! --- DHCP: only the Guest VLAN is dynamically addressed (Users, Servers, Mgmt and DMZ are static) ---------------
ip dhcp excluded-address 10.10.30.1 10.10.30.99
!
ip dhcp pool GUEST
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 172.16.50.20
!
username admin privilege 15 secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
spanning-tree mode pvst
!
! =============================================================================
! Access lists. Every ACL is applied inbound, so a packet is judged before it is routed or translated:
!   * ACLs on the inside interfaces see the original (private) source address;
!   * IN-OUTSIDE sees the public (inside-global) destination address, before NAT translates it.
! [PT-VERIFY] the 'log' keyword on ACL entries
! =============================================================================
ip access-list standard NAT-PAT
 permit 10.10.10.0 0.0.0.255
 permit 10.10.30.0 0.0.0.255
!
ip access-list standard VTY-ADMIN
 permit host 10.10.99.10
 deny any log
!
ip access-list extended IN-USERS
 remark ingress filter: only the Users subnet may source traffic here
 remark -- gateway reachability
 permit icmp 10.10.10.0 0.0.0.255 host 10.10.10.1 echo
 remark -- internal services Users may consume
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.20.10 eq 80
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.20.10 eq 443
 permit tcp 10.10.10.0 0.0.0.255 host 172.16.50.10 eq 80
 permit tcp 10.10.10.0 0.0.0.255 host 172.16.50.10 eq 443
 permit udp 10.10.10.0 0.0.0.255 host 172.16.50.20 eq 53
 permit tcp 10.10.10.0 0.0.0.255 host 172.16.50.20 eq 53
 permit icmp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 echo
 permit icmp 10.10.10.0 0.0.0.255 172.16.50.0 0.0.0.255 echo
 remark -- nothing else inside: Mgmt, Guest, other servers, DMZ hosts and the firewall itself
 deny ip 10.10.10.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 deny ip 10.10.10.0 0.0.0.255 172.16.0.0 0.15.255.255 log
 deny ip 10.10.10.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 remark -- Internet (source-translated by PAT on the outside interface)
 permit tcp 10.10.10.0 0.0.0.255 any eq 80
 permit tcp 10.10.10.0 0.0.0.255 any eq 443
 permit icmp 10.10.10.0 0.0.0.255 any echo
 deny ip any any log
!
ip access-list extended IN-SERVERS
 remark ingress filter: servers answer clients but never open connections to other zones
 remark -- replies to clients; 'established' matches ACK/RST only, it is not stateful (docs/limitations.md)
 permit tcp host 10.10.20.10 eq 80 10.10.10.0 0.0.0.255 established
 permit tcp host 10.10.20.10 eq 443 10.10.10.0 0.0.0.255 established
 permit tcp host 10.10.20.10 eq 80 host 10.10.99.10 established
 permit tcp host 10.10.20.10 eq 443 host 10.10.99.10 established
 permit tcp host 10.10.20.10 eq 80 host 172.16.50.10 established
 permit icmp host 10.10.20.10 10.10.10.0 0.0.0.255 echo-reply
 permit icmp host 10.10.20.10 host 10.10.99.10 echo-reply
 remark -- name resolution through the DMZ DNS server
 permit udp host 10.10.20.10 host 172.16.50.20 eq 53
 permit tcp host 10.10.20.10 host 172.16.50.20 eq 53
 remark -- gateway reachability
 permit icmp 10.10.20.0 0.0.0.255 host 10.10.20.1 echo
 deny ip any any log
!
ip access-list extended IN-GUEST
 remark ingress filter: guests reach the Internet and the DNS server, nothing else
 remark -- DHCP (this router is the DHCP server)
 permit udp host 0.0.0.0 eq 68 host 255.255.255.255 eq 67
 permit udp 10.10.30.0 0.0.0.255 eq 68 host 10.10.30.1 eq 67
 remark -- gateway reachability and DNS
 permit icmp 10.10.30.0 0.0.0.255 host 10.10.30.1 echo
 permit udp 10.10.30.0 0.0.0.255 host 172.16.50.20 eq 53
 permit tcp 10.10.30.0 0.0.0.255 host 172.16.50.20 eq 53
 remark -- no other internal destination
 deny ip 10.10.30.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 deny ip 10.10.30.0 0.0.0.255 172.16.0.0 0.15.255.255 log
 deny ip 10.10.30.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 remark -- Internet (source-translated by PAT)
 permit tcp 10.10.30.0 0.0.0.255 any eq 80
 permit tcp 10.10.30.0 0.0.0.255 any eq 443
 permit icmp 10.10.30.0 0.0.0.255 any echo
 deny ip any any log
!
ip access-list extended IN-MGMT
 remark ingress filter: only the administrator workstation (10.10.99.10) may reach beyond the Mgmt VLAN
 remark -- SSH to the firewall's management address and to the DMZ switch (SW-ACCESS is on this VLAN: no routing)
 permit tcp host 10.10.99.10 host 10.10.99.1 eq 22
 permit tcp host 10.10.99.10 host 172.16.50.2 eq 22
 remark -- service checks
 permit tcp host 10.10.99.10 host 10.10.20.10 eq 80
 permit tcp host 10.10.99.10 host 10.10.20.10 eq 443
 permit tcp host 10.10.99.10 host 172.16.50.10 eq 80
 permit tcp host 10.10.99.10 host 172.16.50.10 eq 443
 permit icmp host 10.10.99.10 10.10.10.0 0.0.0.255 echo
 permit icmp host 10.10.99.10 10.10.20.0 0.0.0.255 echo
 permit icmp host 10.10.99.10 172.16.50.0 0.0.0.255 echo
 permit icmp 10.10.99.0 0.0.0.255 host 10.10.99.1 echo
 remark -- time service answers to the DMZ switch
 permit udp host 10.10.99.20 eq 123 host 172.16.50.2 eq 123
 deny ip any any log
!
ip access-list extended IN-DMZ
 remark ingress filter: DMZ hosts answer requests; they never initiate connections inward or to the Internet
 remark -- DMZ switch -> log server and time server; SSH replies to the administrator
 permit udp host 172.16.50.2 host 10.10.99.20 eq 514
 permit udp host 172.16.50.2 eq 123 host 10.10.99.20 eq 123
 permit tcp host 172.16.50.2 eq 22 host 10.10.99.10 established
 remark -- the one controlled web-tier -> app-tier flow
 permit tcp host 172.16.50.10 host 10.10.20.10 eq 80
 remark -- replies to internal clients
 permit tcp host 172.16.50.10 eq 80 10.10.10.0 0.0.0.255 established
 permit tcp host 172.16.50.10 eq 443 10.10.10.0 0.0.0.255 established
 permit tcp host 172.16.50.10 eq 80 host 10.10.99.10 established
 permit tcp host 172.16.50.10 eq 443 host 10.10.99.10 established
 permit udp host 172.16.50.20 eq 53 10.10.10.0 0.0.0.255
 permit udp host 172.16.50.20 eq 53 10.10.20.0 0.0.0.255
 permit udp host 172.16.50.20 eq 53 10.10.30.0 0.0.0.255
 permit tcp host 172.16.50.20 eq 53 10.10.10.0 0.0.0.255 established
 permit tcp host 172.16.50.20 eq 53 10.10.20.0 0.0.0.255 established
 permit tcp host 172.16.50.20 eq 53 10.10.30.0 0.0.0.255 established
 permit icmp 172.16.50.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
 permit icmp 172.16.50.0 0.0.0.255 host 10.10.99.10 echo-reply
 remark -- no other private destination
 deny ip 172.16.50.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 deny ip 172.16.50.0 0.0.0.255 172.16.0.0 0.15.255.255 log
 deny ip 172.16.50.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 remark -- replies to Internet clients (source seen here is the private address, before static NAT)
 permit tcp host 172.16.50.10 eq 80 any established
 permit tcp host 172.16.50.10 eq 443 any established
 permit udp host 172.16.50.20 eq 53 any
 permit tcp host 172.16.50.20 eq 53 any established
 deny ip any any log
!
ip access-list extended IN-OUTSIDE
 remark anti-spoofing: private, loopback, link-local, multicast, reserved and our own public addresses are never valid sources
 deny ip 10.0.0.0 0.255.255.255 any log
 deny ip 172.16.0.0 0.15.255.255 any log
 deny ip 192.168.0.0 0.0.255.255 any log
 deny ip 127.0.0.0 0.255.255.255 any log
 deny ip 169.254.0.0 0.0.255.255 any log
 deny ip 224.0.0.0 15.255.255.255 any log
 deny ip 240.0.0.0 15.255.255.255 any log
 deny ip 0.0.0.0 0.255.255.255 any log
 deny ip host 203.0.113.2 any log
 deny ip 203.0.113.8 0.0.0.7 any log
 remark published services (destination = public address, matched before NAT)
 permit tcp any host 203.0.113.9 eq 80
 permit tcp any host 203.0.113.9 eq 443
 permit udp any host 203.0.113.10 eq 53
 permit tcp any host 203.0.113.10 eq 53
 remark return traffic for connections opened from inside (destination = PAT address)
 permit tcp any eq 80 host 203.0.113.2 established
 permit tcp any eq 443 host 203.0.113.2 established
 permit icmp any host 203.0.113.2 echo-reply
 permit icmp any host 203.0.113.2 unreachable
 permit icmp any host 203.0.113.2 time-exceeded
 deny ip any any log
!
! --- NAT ------------------------------------------------------------------------------------------------------------
! [PT-VERIFY] static NAT whose inside-global address (203.0.113.9/.10) is routed by the ISP, not directly connected
ip nat inside source list NAT-PAT interface Ethernet0/1/0 overload
ip nat inside source static 172.16.50.10 203.0.113.9
ip nat inside source static 172.16.50.20 203.0.113.10
!
! --- Inside trunk (router-on-a-stick); the physical interface carries no address ---------------------------------
interface FastEthernet0/0
 description TRUNK to SW-ACCESS Fa0/3 (VLANs 10,20,30,99)
 no ip address
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/0.10
 description ZONE USERS 10.10.10.0/24
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip access-group IN-USERS in
 ip nat inside
 ! [PT-VERIFY] 'no ip redirects' / 'no ip proxy-arp' on subinterfaces
 no ip redirects
 no ip proxy-arp
!
interface FastEthernet0/0.20
 description ZONE SERVERS 10.10.20.0/24
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 ip access-group IN-SERVERS in
 ip nat inside
 no ip redirects
 no ip proxy-arp
!
interface FastEthernet0/0.30
 description ZONE GUEST 10.10.30.0/24 (DHCP)
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 ip access-group IN-GUEST in
 ip nat inside
 no ip redirects
 no ip proxy-arp
!
interface FastEthernet0/0.99
 description ZONE MGMT 10.10.99.0/24
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
 ip access-group IN-MGMT in
 ip nat inside
 no ip redirects
 no ip proxy-arp
!
! --- DMZ leg ------------------------------------------------------------------------------------------------------
interface FastEthernet0/1
 description DMZ 172.16.50.0/24 to SW-DMZ Fa0/3
 ip address 172.16.50.1 255.255.255.0
 ip access-group IN-DMZ in
 ip nat inside
 no ip redirects
 no ip proxy-arp
 duplex auto
 speed auto
 no shutdown
!
! --- Outside leg ----------------------------------------------------------------------------------------------------
interface Ethernet0/1/0
 description OUTSIDE to ISP-R Fa0/1 (203.0.113.0/30)
 ip address 203.0.113.2 255.255.255.252
 ip access-group IN-OUTSIDE in
 ip nat outside
 no ip redirects
 ! [PT-VERIFY] 'no ip unreachables'
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
! --- Routing: static only (no routing protocol, so no routing updates to authenticate) ----------------------------
ip classless
ip route 0.0.0.0 0.0.0.0 203.0.113.1
! [PT-VERIFY] discard route for the public NAT block (stops loops and kills hairpin attempts to 203.0.113.8/29)
ip route 203.0.113.8 255.255.255.248 Null0
!
no ip http server
no ip http secure-server
ip ssh version 2
! [PT-VERIFY] 'ip ssh time-out' / 'ip ssh authentication-retries'
ip ssh time-out 60
ip ssh authentication-retries 3
no cdp run
!
! --- Logging and time ----------------------------------------------------------------------------------------------
! [PT-VERIFY] 'logging source-interface'
logging source-interface FastEthernet0/0.99
logging trap informational
logging host 10.10.99.20
! [PT-VERIFY] 'ntp server'
ntp server 10.10.99.20
!
banner motd #
AUTHORIZED ACCESS ONLY. This system is part of a lab network. Activity is logged and monitored.
Disconnect now if you are not an authorized administrator.
#
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line aux 0
 ! [PT-VERIFY] 'no exec' on the AUX line
 no exec
 transport input none
!
line vty 0 4
 access-class VTY-ADMIN in
 exec-timeout 5 0
 login local
 transport input ssh
!
end
