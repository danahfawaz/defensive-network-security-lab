! =============================================================================
! BASELINE CONFIGURATION - SW-DMZ (Packet Tracer device "Switch1", Cisco 2960-24TT, IOS 15.0)
! DMZ VLAN and management address as in the hardened design, with no Layer 2 or management hardening.
! =============================================================================
!
version 15.0
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname SW-DMZ
!
enable password cisco
!
spanning-tree mode pvst
spanning-tree extend system-id
!
vlan 50
 name DMZ
!
interface FastEthernet0/1
 switchport access vlan 50
 switchport mode access
!
interface FastEthernet0/2
 switchport access vlan 50
 switchport mode access
!
interface FastEthernet0/3
 switchport access vlan 50
 switchport mode access
!
interface range FastEthernet0/4 - 24
!
interface range GigabitEthernet0/1 - 2
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan50
 ip address 172.16.50.2 255.255.255.0
!
ip default-gateway 172.16.50.1
!
line con 0
 password cisco
 login
!
line vty 0 4
 password cisco
 login
!
line vty 5 15
 password cisco
 login
!
end
