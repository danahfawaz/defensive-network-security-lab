! =============================================================================
! BASELINE CONFIGURATION - FW-EDGE (Packet Tracer device "Router1", Cisco 1841, IOS 12.4)
! The redesigned network (same zones, VLANs, addressing, NAT and routing as the hardened design) configured the way a
! first working version usually is: it connects everything, and security was an afterthought.
!   * guest isolation is a single numbered ACL ending in 'permit ip any any'
!   * the other zones have no filtering at all
!   * Telnet with shared line passwords, an enable password in clear text, HTTP server and CDP left on
! The weak passwords are the well-known lab defaults ("cisco"); they exist to be found by the auditor.
! =============================================================================
!
version 12.4
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname FW-EDGE
!
enable password cisco
!
ip dhcp excluded-address 10.10.30.1 10.10.30.99
!
ip dhcp pool GUEST
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 172.16.50.20
!
spanning-tree mode pvst
!
interface FastEthernet0/0
 no ip address
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip nat inside
!
interface FastEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 ip nat inside
!
interface FastEthernet0/0.30
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 ip access-group 101 in
 ip nat inside
!
interface FastEthernet0/0.99
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
 ip nat inside
!
interface FastEthernet0/1
 ip address 172.16.50.1 255.255.255.0
 ip nat inside
 duplex auto
 speed auto
 no shutdown
!
interface Ethernet0/1/0
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip nat inside source list 1 interface Ethernet0/1/0 overload
ip nat inside source static 172.16.50.10 203.0.113.9
ip nat inside source static 172.16.50.20 203.0.113.10
ip classless
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 203.0.113.8 255.255.255.248 Null0
!
ip http server
!
access-list 1 permit 10.10.0.0 0.0.255.255
access-list 101 remark keep guests away from the Users subnet
access-list 101 deny ip 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255
access-list 101 permit ip any any
!
line con 0
 password cisco
 login
!
line aux 0
!
line vty 0 4
 password cisco
 login
!
end
