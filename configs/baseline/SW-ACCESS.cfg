! =============================================================================
! BASELINE CONFIGURATION - SW-ACCESS (Packet Tracer device "Switch0", Cisco 2960-24TT, IOS 15.0)
! VLANs, access ports, trunk and management address as in the hardened design, with no Layer 2 or management hardening:
! ports default to dynamic trunking, unused ports stay up in VLAN 1, the trunk keeps native VLAN 1 and allows every VLAN,
! Telnet with a shared line password, enable password in clear text.
! =============================================================================
!
version 15.0
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname SW-ACCESS
!
enable password cisco
!
spanning-tree mode pvst
spanning-tree extend system-id
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 30
 name GUEST
vlan 99
 name MGMT
!
interface FastEthernet0/1
 switchport access vlan 10
 switchport mode access
!
interface FastEthernet0/2
 switchport access vlan 10
 switchport mode access
!
interface FastEthernet0/3
 switchport mode trunk
!
interface FastEthernet0/4
 switchport access vlan 30
 switchport mode access
!
interface FastEthernet0/5
 switchport access vlan 99
 switchport mode access
!
interface FastEthernet0/6
 switchport access vlan 20
 switchport mode access
!
interface FastEthernet0/7
 switchport access vlan 99
 switchport mode access
!
interface range FastEthernet0/8 - 24
!
interface range GigabitEthernet0/1 - 2
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 ip address 10.10.99.2 255.255.255.0
!
ip default-gateway 10.10.99.1
!
line con 0
 password cisco
 login
!
line vty 0 4
 password cisco
 login
!
line vty 5 15
 password cisco
 login
!
end
