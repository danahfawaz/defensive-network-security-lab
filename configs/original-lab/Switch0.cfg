! =============================================================================
! ORIGINAL LAB CONFIGURATION - Packet Tracer device label "Switch0" (Cisco 2960-24TT, IOS 15.0)
! Role in the original lab: LAN 1 access switch (PC0 Fa0/1, PC1 Fa0/2, uplink to Router2 on Fa0/3)
! The running-config below is exactly what the Packet Tracer file stored;
! only this comment header was added.
! =============================================================================
