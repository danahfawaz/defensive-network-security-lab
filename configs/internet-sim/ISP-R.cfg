! =============================================================================
! SIMULATED INTERNET - ISP-R (Packet Tracer device "Router4", Cisco 1841, IOS 12.4)
! Role: the provider and the "Internet" behind it. This is test infrastructure, not part of the audited enterprise.
!   Fa0/1 203.0.113.1/30  transit link to FW-EDGE Eth0/1/0 (203.0.113.0/30)
!   Fa0/0 198.51.100.1/24 simulated Internet LAN (SW-INET): PC4 legitimate client, PC5 attacker, WEB-EXT public site
! The provider routes the customer's public block 203.0.113.8/29 to FW-EDGE. Like the real Internet it has no route to
! any private (RFC 1918) network, so private addresses are unreachable from here.
! Secrets: placeholders only ("labonly"); scripts/render_configs.py swaps in your own.
! =============================================================================
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname ISP-R
!
enable secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
no ip domain-lookup
username admin privilege 15 secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
spanning-tree mode pvst
!
interface FastEthernet0/0
 description Internet LAN to SW-INET Fa0/3
 ip address 198.51.100.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
interface FastEthernet0/1
 description Transit to customer FW-EDGE Eth0/1/0
 ip address 203.0.113.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
ip route 203.0.113.8 255.255.255.248 203.0.113.2
!
no ip http server
no cdp run
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 exec-timeout 5 0
 login local
 transport input none
!
end
