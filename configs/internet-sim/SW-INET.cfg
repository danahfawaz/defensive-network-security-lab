! =============================================================================
! SIMULATED INTERNET - SW-INET (Packet Tracer device "Switch2", Cisco 2960-24TT, IOS 15.0)
! Role: LAN of the simulated Internet. Test infrastructure, not part of the audited enterprise.
! Port map:  Fa0/1 PC4 (legitimate client)   Fa0/2 PC5 (attacker)   Fa0/3 uplink to ISP-R Fa0/0   Fa0/4 WEB-EXT
! Console-only: no management address, no remote access.
! Secrets: placeholders only ("labonly"); scripts/render_configs.py swaps in your own.
! =============================================================================
!
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SW-INET
!
enable secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
no ip domain-lookup
username admin privilege 15 secret 5 $1$labonly$xxxxxxxxxxxxxxxxxxxxxx
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
vtp mode transparent
!
vlan 100
 name INTERNET
vlan 999
 name PARKING
!
no ip http server
no cdp run
!
interface FastEthernet0/1
 description PC4 legitimate client
 switchport access vlan 100
 switchport mode access
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description PC5 attacker
 switchport access vlan 100
 switchport mode access
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description UPLINK to ISP-R Fa0/0
 switchport access vlan 100
 switchport mode access
 switchport nonegotiate
!
interface FastEthernet0/4
 description WEB-EXT public web site
 switchport access vlan 100
 switchport mode access
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range FastEthernet0/5 - 24
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
!
interface range GigabitEthernet0/1 - 2
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line vty 0 4
 exec-timeout 5 0
 login local
 transport input none
!
line vty 5 15
 exec-timeout 5 0
 login local
 transport input none
!
end
