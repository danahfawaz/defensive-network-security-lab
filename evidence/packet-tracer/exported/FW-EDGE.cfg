
!
version 12.4
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
!
hostname FW-EDGE
!
login block-for 120 attempts 3 within 60
!
!
enable secret 5 XXXX
!
!
ip dhcp excluded-address 10.10.30.1 10.10.30.99
!
ip dhcp pool GUEST
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 172.16.50.20
!
!
!
no ip cef
no ipv6 cef
!
!
!
username admin privilege 15 secret 5 XXXX
!
!
!
!
!
!
!
!
!
!
ip ssh version 2
ip ssh time-out 60
no ip domain-lookup
ip domain-name lab.local
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description TRUNK to SW-ACCESS Fa0/3 (VLANs 10,20,30,99)
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/0.10
 description ZONE USERS 10.10.10.0/24
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 no ip proxy-arp
 ip nat inside
 ip access-group IN-USERS in
!
interface FastEthernet0/0.20
 description ZONE SERVERS 10.10.20.0/24
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 no ip proxy-arp
 ip nat inside
 ip access-group IN-SERVERS in
!
interface FastEthernet0/0.30
 description ZONE GUEST 10.10.30.0/24 (DHCP)
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 no ip proxy-arp
 ip nat inside
 ip access-group IN-GUEST in
!
interface FastEthernet0/0.99
 description ZONE MGMT 10.10.99.0/24
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
 no ip proxy-arp
 ip nat inside
 ip access-group IN-MGMT in
!
interface FastEthernet0/1
 description DMZ 172.16.50.0/24 to SW-DMZ Fa0/3
 ip address 172.16.50.1 255.255.255.0
 no ip proxy-arp
 ip nat inside
 ip access-group IN-DMZ in
 duplex auto
 speed auto
!
interface Ethernet0/1/0
 description OUTSIDE to ISP-R Fa0/1 (203.0.113.0/30)
 ip address 203.0.113.2 255.255.255.252
 no ip proxy-arp
 ip nat outside
 ip access-group IN-OUTSIDE in
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
ip nat inside source list NAT-PAT interface Ethernet0/1/0 overload
ip nat inside source static 172.16.50.10 203.0.113.9 
ip nat inside source static 172.16.50.20 203.0.113.10 
ip classless
ip route 0.0.0.0 0.0.0.0 203.0.113.1 
ip route 203.0.113.8 255.255.255.248 Null0 
!
ip flow-export version 9
!
!
ip access-list extended sl_def_acl
 deny tcp any any eq telnet
 deny tcp any any eq www
 deny tcp any any eq 22
 permit tcp any any eq 22
ip access-list standard NAT-PAT
 permit 10.10.10.0 0.0.0.255
 permit 10.10.30.0 0.0.0.255
ip access-list standard VTY-ADMIN
 permit host 10.10.99.10
ip access-list extended IN-USERS
 remark ingress filter: only the Users subnet may source traffic here
 remark -- gateway reachability
 permit icmp 10.10.10.0 0.0.0.255 host 10.10.10.1 echo
 remark -- internal services Users may consume
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.20.10 eq www
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.20.10 eq 443
 permit tcp 10.10.10.0 0.0.0.255 host 172.16.50.10 eq www
 permit tcp 10.10.10.0 0.0.0.255 host 172.16.50.10 eq 443
 permit udp 10.10.10.0 0.0.0.255 host 172.16.50.20 eq domain
 permit tcp 10.10.10.0 0.0.0.255 host 172.16.50.20 eq domain
 permit icmp 10.10.10.0 0.0.0.255 host 10.10.20.10 echo
 permit icmp 10.10.10.0 0.0.0.255 host 172.16.50.10 echo
 permit icmp 10.10.10.0 0.0.0.255 host 172.16.50.20 echo
 remark -- replies to the administrator's diagnostics (IN-MGMT lets the administrator ping the Users subnet)
 permit icmp 10.10.10.0 0.0.0.255 host 10.10.99.10 echo-reply
 remark -- nothing else inside: Mgmt, Guest, other servers, DMZ hosts and the firewall itself
 remark -- the firewall's own outside address is not "the Internet" for internal clients
 remark -- Internet (source-translated by PAT on the outside interface)
 permit tcp 10.10.10.0 0.0.0.255 any eq www
 permit tcp 10.10.10.0 0.0.0.255 any eq 443
 permit icmp 10.10.10.0 0.0.0.255 any echo
ip access-list extended IN-SERVERS
 remark ingress filter: servers answer clients but never open connections to other zones
 remark -- replies to clients; 'established' matches ACK/RST only, it is not stateful (docs/limitations.md)
 permit tcp host 10.10.20.10 eq www 10.10.10.0 0.0.0.255 established
 permit tcp host 10.10.20.10 eq 443 10.10.10.0 0.0.0.255 established
 permit tcp host 10.10.20.10 eq www host 10.10.99.10 established
 permit tcp host 10.10.20.10 eq 443 host 10.10.99.10 established
 permit tcp host 10.10.20.10 eq www host 172.16.50.10 established
 permit icmp host 10.10.20.10 10.10.10.0 0.0.0.255 echo-reply
 permit icmp host 10.10.20.10 host 10.10.99.10 echo-reply
 remark -- name resolution through the DMZ DNS server
 permit udp host 10.10.20.10 host 172.16.50.20 eq domain
 permit tcp host 10.10.20.10 host 172.16.50.20 eq domain
 remark -- gateway reachability
 permit icmp 10.10.20.0 0.0.0.255 host 10.10.20.1 echo
ip access-list extended IN-GUEST
 remark ingress filter: guests reach the Internet and the DNS server, nothing else
 remark -- DHCP (this router is the DHCP server)
 permit udp host 0.0.0.0 eq bootpc host 255.255.255.255 eq bootps
 permit udp 10.10.30.0 0.0.0.255 eq bootpc host 10.10.30.1 eq bootps
 remark -- gateway reachability and DNS
 permit icmp 10.10.30.0 0.0.0.255 host 10.10.30.1 echo
 permit udp 10.10.30.0 0.0.0.255 host 172.16.50.20 eq domain
 permit tcp 10.10.30.0 0.0.0.255 host 172.16.50.20 eq domain
 remark -- no other internal destination
 remark -- the firewall's own outside address is not "the Internet" for guests
 remark -- Internet (source-translated by PAT)
 permit tcp 10.10.30.0 0.0.0.255 any eq www
 permit tcp 10.10.30.0 0.0.0.255 any eq 443
 permit icmp 10.10.30.0 0.0.0.255 any echo
ip access-list extended IN-MGMT
 remark ingress filter: only the administrator workstation (10.10.99.10) may reach beyond the Mgmt VLAN
 remark -- SSH to the firewall's management address and to the DMZ switch (SW-ACCESS is on this VLAN: no routing)
 permit tcp host 10.10.99.10 host 10.10.99.1 eq 22
 permit tcp host 10.10.99.10 host 172.16.50.2 eq 22
 remark -- service checks
 permit tcp host 10.10.99.10 host 10.10.20.10 eq www
 permit tcp host 10.10.99.10 host 10.10.20.10 eq 443
 permit tcp host 10.10.99.10 host 172.16.50.10 eq www
 permit tcp host 10.10.99.10 host 172.16.50.10 eq 443
 permit icmp host 10.10.99.10 10.10.10.0 0.0.0.255 echo
 permit icmp host 10.10.99.10 host 10.10.20.10 echo
 permit icmp host 10.10.99.10 host 172.16.50.2 echo
 permit icmp host 10.10.99.10 host 172.16.50.10 echo
 permit icmp host 10.10.99.10 host 172.16.50.20 echo
 permit icmp 10.10.99.0 0.0.0.255 host 10.10.99.1 echo
 remark -- time service answers to the firewall itself and to the DMZ switch
 permit udp host 10.10.99.20 eq 123 host 10.10.99.1 eq 123
 permit udp host 10.10.99.20 eq 123 host 172.16.50.2 eq 123
ip access-list extended IN-DMZ
 remark ingress filter: DMZ hosts answer requests; they never initiate connections inward or to the Internet
 remark -- DMZ switch -> log server and time server; SSH replies to the administrator
 permit udp host 172.16.50.2 host 10.10.99.20 eq 514
 permit udp host 172.16.50.2 eq 123 host 10.10.99.20 eq 123
 permit tcp host 172.16.50.2 eq 22 host 10.10.99.10 established
 remark -- the one controlled web-tier -> app-tier flow
 permit tcp host 172.16.50.10 host 10.10.20.10 eq www
 remark -- replies to internal clients
 permit tcp host 172.16.50.10 eq www 10.10.10.0 0.0.0.255 established
 permit tcp host 172.16.50.10 eq 443 10.10.10.0 0.0.0.255 established
 permit tcp host 172.16.50.10 eq www host 10.10.99.10 established
 permit tcp host 172.16.50.10 eq 443 host 10.10.99.10 established
 permit udp host 172.16.50.20 eq domain 10.10.10.0 0.0.0.255
 permit udp host 172.16.50.20 eq domain 10.10.20.0 0.0.0.255
 permit udp host 172.16.50.20 eq domain 10.10.30.0 0.0.0.255
 permit tcp host 172.16.50.20 eq domain 10.10.10.0 0.0.0.255 established
 permit tcp host 172.16.50.20 eq domain 10.10.20.0 0.0.0.255 established
 permit tcp host 172.16.50.20 eq domain 10.10.30.0 0.0.0.255 established
 permit icmp 172.16.50.0 0.0.0.255 10.10.10.0 0.0.0.255 echo-reply
 permit icmp 172.16.50.0 0.0.0.255 host 10.10.99.10 echo-reply
 remark -- no other private destination
 remark -- replies to Internet clients (source seen here is the private address, before static NAT)
 permit tcp host 172.16.50.10 eq www any established
 permit tcp host 172.16.50.10 eq 443 any established
 permit udp host 172.16.50.20 eq domain any
 permit tcp host 172.16.50.20 eq domain any established
ip access-list extended IN-OUTSIDE
 remark anti-spoofing: private, loopback, link-local, multicast, reserved and our own public addresses are never valid sources
 remark published services (destination = public address, matched before NAT)
 permit tcp any host 203.0.113.9 eq www
 permit tcp any host 203.0.113.9 eq 443
 permit udp any host 203.0.113.10 eq domain
 permit tcp any host 203.0.113.10 eq domain
 remark return traffic for connections opened from inside (destination = PAT address)
 permit tcp any eq www host 203.0.113.2 established
 permit tcp any eq 443 host 203.0.113.2 established
 permit icmp any host 203.0.113.2 echo-reply
 permit icmp any host 203.0.113.2 unreachable
!
no cdp run
!
banner motd ^C
AUTHORIZED ACCESS ONLY. This system is part of a lab network. Activity is logged and monitored.
Disconnect now if you are not an authorized administrator.
^C
!
!
!
!
!
logging 10.10.99.20
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line aux 0
 exec-timeout 0 0
!
line vty 0 4
 access-class VTY-ADMIN in
 exec-timeout 5 0
 login local
 transport input ssh
!
!
ntp server 10.10.99.20
!
end
