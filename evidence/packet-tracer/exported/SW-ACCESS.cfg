!
interface Vlan99
 description MANAGEMENT SVI
 ip address 10.10.99.2 255.255.255.0
!
ip default-gateway 10.10.99.1
!
no cdp run
!
banner motd ^C
AUTHORIZED ACCESS ONLY. This system is part of a lab network. Activity is logged and monitored.
Disconnect now if you are not an authorized administrator.
^C
logging 10.10.99.20
!
!
!
ip access-list standard VTY-ADMIN
 permit host 10.10.99.10
line con 0
 logging synchronous
 login local
 exec-timeout 5 0
!
line vty 0 4
 access-class VTY-ADMIN in
 exec-timeout 5 0
 login local
 transport input ssh
line vty 5 15
 access-class VTY-ADMIN in
 exec-timeout 5 0
 login local
 transport input ssh
!
!
!
ntp server 10.10.99.20
!
end
