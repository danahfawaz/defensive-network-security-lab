
!
version 15.0
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
!
hostname SW-ACCESS
!
enable secret 5 XXXX
!
!
!
ip ssh version 2
ip ssh time-out 60
no ip domain-lookup
ip domain-name lab.local
!
username admin secret 5 XXXX
!
vtp mode transparent
!
ip arp inspection vlan 30
!
ip dhcp snooping vlan 30
no ip dhcp snooping information option
ip dhcp snooping
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
vlan 30
 name GUEST
!
vlan 99
 name MGMT
!
vlan 999
 name PARKING
!
interface FastEthernet0/1
 description USERS - PC0
 switchport access vlan 10
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0030.A31C.30C0
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description USERS - PC1
 switchport access vlan 10
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0050.0F67.4178
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description TRUNK - FW-EDGE Fa0/0 (VLANs 10,20,30,99)
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 ip arp inspection trust
 ip dhcp snooping trust
 switchport mode trunk
 switchport nonegotiate
!
interface FastEthernet0/4
 description GUEST - PC2 (DHCP)
 switchport access vlan 30
 ip dhcp snooping limit rate 15
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0090.0CD1.7010
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/5
 description MGMT - PC3 (administrator workstation)
 switchport access vlan 99
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0030.A3E3.DED7
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/6
 description SERVERS - SRV-APP
 switchport access vlan 20
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0009.7CD9.ED0B
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/7
 description MGMT - SRV-LOG (syslog + NTP)
 switchport access vlan 99
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0050.0FA5.535C
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/8
 description UNUSED
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
!
