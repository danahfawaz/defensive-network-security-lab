!
!
!
ip access-list standard VTY-ADMIN
 permit host 10.10.99.10
line con 0
 logging synchronous
 login local
 exec-timeout 5 0
!
line vty 0 4
 access-class VTY-ADMIN in
 exec-timeout 5 0
