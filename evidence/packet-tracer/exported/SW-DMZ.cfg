
!
version 15.0
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
!
hostname SW-DMZ
!
enable secret 5 XXXX
!
!
!
ip ssh version 2
ip ssh time-out 60
no ip domain-lookup
ip domain-name lab.local
!
username admin secret 5 XXXX
!
vtp mode transparent
!
!
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 50
 name DMZ
!
vlan 999
 name PARKING
!
interface FastEthernet0/1
 description DMZ - WEB-DMZ (public 203.0.113.9)
 switchport access vlan 50
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0030.F2B0.B5C5
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description DMZ - DNS-DMZ (public 203.0.113.10)
 switchport access vlan 50
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 000D.BD9C.B99A
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description UPLINK - FW-EDGE Fa0/1 (only the firewall's MAC may appear here)
 switchport access vlan 50
 switchport mode access
 switchport nonegotiate
 switchport port-security
 switchport port-security mac-address sticky 
 switchport port-security mac-address sticky 0090.2118.8102
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/4
 description UNUSED
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
